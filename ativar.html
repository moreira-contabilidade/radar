<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ativar o quadradinho · Radar Moreira</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F2F5F9;color:#1D2E46}
main{max-width:460px;margin:0 auto;padding:28px 18px}
.box{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(29,46,70,.10)}
h1{font-size:22px;margin:0 0 10px}p{line-height:1.5;margin:0 0 14px;color:#41516A}
button{width:100%;border:0;border-radius:12px;background:#1D2E46;color:#fff;font-size:18px;font-weight:700;padding:16px;cursor:pointer}
button[disabled]{opacity:.6}
#res{margin-top:16px}
.cod{font-size:22px;font-weight:800;letter-spacing:.5px;background:#FFF7E0;border:2px solid #A6841F;border-radius:12px;padding:14px;text-align:center;word-break:break-all;color:#1D2E46;user-select:all}
.ok{color:#1F8F55;font-weight:700}.err{color:#B42318;font-weight:700}
.copy{margin-top:10px;background:#355380}
</style>
</head>
<body>
<main><div class="box">
<h1>Ativar o quadradinho do site</h1>
<p>Toque no botão uma única vez. Depois copie o código que aparecer e mande para o Claude na conversa.</p>
<button id="b">Ativar agora</button>
<div id="res"></div>
</div></main>
<script>
const b=document.getElementById('b'),res=document.getElementById('res');
const H={'Content-Type':'application/json',Accept:'application/json'};
b.onclick=async()=>{b.disabled=true;b.textContent='Ativando...';res.innerHTML='';
  try{
    const r=await fetch('https://jsonblob.com/api/jsonBlob',{method:'POST',headers:H,body:JSON.stringify({itens:{},criado_em:new Date().toISOString()})});
    if(!r.ok)throw new Error('criar '+r.status);
    let id=r.headers.get('X-jsonblob')||'';const loc=r.headers.get('Location')||'';
    if(!id&&loc)id=loc.split('/').pop();
    if(!id)throw new Error('sem código (cabeçalho bloqueado)');
    const u='https://jsonblob.com/api/jsonBlob/'+id;
    const p=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({itens:{},teste:'ok'})});if(!p.ok)throw new Error('gravar '+p.status);
    const g=await fetch(u,{headers:{Accept:'application/json'},cache:'no-store'});const j=await g.json();if(j.teste!=='ok')throw new Error('ler');
    await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({itens:{}})});
    res.innerHTML='<p class="ok">Funcionou! Copie o código abaixo e mande para o Claude:</p><div class="cod" id="c">ATIVAR '+id+'</div><button class="copy" id="cp">Copiar código</button>';
    document.getElementById('cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText('ATIVAR '+id).then(()=>{document.getElementById('cp').textContent='Copiado!'})};
    b.textContent='Ativado';
  }catch(e){res.innerHTML='<p class="err">Não funcionou neste aparelho.</p><p>Mande para o Claude esta mensagem: <b>ERRO '+String(e.message||e).replace(/</g,'&lt;')+'</b></p>';b.disabled=false;b.textContent='Tentar de novo'}
};
</script>
</body>
</html>
