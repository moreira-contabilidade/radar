<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resumo do mês · Moreira Contabilidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:12mm 12mm 14mm}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,system-ui,sans-serif;color:#1D2E46;background:#E9EEF5;font-size:11pt;line-height:1.45}
.bar{position:sticky;top:0;z-index:5;background:#1D2E46;color:#fff;display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;flex-wrap:wrap}
.bar select,.bar button{font:inherit;font-size:15px;border-radius:10px;padding:9px 14px;border:0}.bar button{background:#D9B54A;color:#1D2E46;font-weight:700;cursor:pointer}
.folha{background:#fff;max-width:210mm;margin:16px auto;padding:0 0 10mm;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.cab{background:#1D2E46;color:#fff;padding:9mm 10mm 7mm;position:relative}
.cab img{height:34px}.cab .k{color:#D9B54A;font-weight:700;letter-spacing:.12em;font-size:8.5pt;margin-top:6mm;text-transform:uppercase}
.cab h1{margin:2mm 0 1mm;font-size:22pt;line-height:1.1}.cab p{margin:0;color:#C9D3E0;font-size:10pt}
.cont{padding:6mm 10mm 0}
h2{font-size:14pt;margin:6mm 0 3mm;padding-bottom:2mm;border-bottom:2px solid #A6841F;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:9pt;color:#5A6B82;font-weight:500}
.alerta{border:2px solid #A6841F;background:#FFF7E0;border-radius:10px;padding:3.5mm 4mm;margin:4mm 0}.alerta b{display:block;font-size:11.5pt}
table{width:100%;border-collapse:collapse;font-size:10pt}td{padding:2.2mm 2mm;border-bottom:1px solid #E1E7EF;vertical-align:top}
td.d{width:21mm;font-weight:800;white-space:nowrap}td.d small{display:block;font-weight:500;color:#5A6B82;font-size:8.5pt}
td b{display:block}td span{color:#41516A;font-size:9.3pt}tr.fer td.d{color:#A6841F}
.tag{display:inline-block;font-size:7.5pt;font-weight:700;border-radius:4px;padding:.3mm 1.6mm;background:#E1E7EF;color:#355380;margin-left:1mm;vertical-align:1px}
.tag.m{background:#FDE7E5;color:#B42318}
.nov{border:1px solid #E1E7EF;border-left:4px solid #355380;border-radius:8px;padding:3mm 4mm;margin:0 0 3mm;break-inside:avoid}.nov.dp{border-left-color:#A6841F}
.nov h3{margin:0 0 1mm;font-size:11pt}.nov p{margin:0 0 1mm;font-size:9.8pt;color:#41516A}.nov .ac{color:#1D2E46;font-weight:600}
.rod{margin:8mm 10mm 0;padding-top:4mm;border-top:1px solid #E1E7EF;font-size:8.8pt;color:#5A6B82;display:flex;justify-content:space-between;gap:6mm;flex-wrap:wrap}
.vazio{color:#5A6B82;font-style:italic}
@media print{body{background:#fff}.bar{display:none}.folha{margin:0;box-shadow:none;max-width:none;padding:0}.cab{-webkit-print-color-adjust:exact;print-color-adjust:exact}h2{break-after:avoid}tr{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="bar"><label>Mês: <select id="mes"></select></label><label>Cidade: <select id="cid"><option value="">Todas</option><option>Marabá</option><option>Parauapebas</option><option>Castanhal</option><option>Xinguara</option><option>Itupiranga</option></select></label><button id="pdf">Salvar em PDF</button></div>
<div class="folha" id="folha"><div class="cont"><p>Carregando…</p></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=s=>String(s||'').replace(/\*\*/g,'');
const DS=['dom','seg','ter','qua','qui','sex','sáb'];
const temMulta=i=>i.multa===true||/multa|escala|jornada|6x1|5x2|registro|sal[aá]rio|FGTS|13º|rescis|f[eé]rias/i.test((i.titulo||'')+' '+(i.resumo||''));
function prazoArea(p){if(p.area)return p.area;if(p.tipo==='trabalhista'||p.tipo==='feriado')return 'dp';
  return /FGTS|eSocial|13º|folha|DARF da DCTFWeb|DCTFWeb|INSS|jornada|feriado|sindic|admiss|férias|rescis|funcion|invent[aá]rio/i.test(p.titulo+' '+(p.detalhe||''))?(/invent[aá]rio/i.test(p.titulo)?'fiscal':'dp'):'fiscal'}
function amigo(p){const t=p.titulo;const m=t.match(/\((compet[eê]ncia [^)]*)\)/i);const comp=m?' · '+m[1]:'';
  const R=[[/^DAS-MEI/i,'Guia mensal do MEI (DAS-MEI)'],[/^DAS do Simples/i,'Guia do Simples Nacional (DAS)'],[/^FGTS mensal/i,'Guia do FGTS dos funcionários'],[/^DARF da DCTFWeb/i,'Guia do INSS e do IR descontado dos funcionários'],[/^eSocial: fechamento/i,'Envio da folha de pagamento ao governo (eSocial)'],[/^DCTFWeb e eSocial da folha do 13/i,'Envio da folha do 13º salário ao governo'],[/^DCTFWeb/i,'Declaração do INSS da folha (DCTFWeb)'],[/^EFD-Reinf/i,'Declaração de retenções de impostos (EFD-Reinf)'],[/^EFD-Contribui/i,'Declaração do PIS e da Cofins (EFD-Contribuições)'],[/^PIS\/Cofins/i,'Guia do PIS e da Cofins'],[/^IPI/i,'Guia do IPI (indústrias)'],[/^IRPJ e CSLL por estimativa/i,'Guia do IR e da CSLL da empresa (Lucro Real, mensal)'],[/^IRPJ e CSLL trimestrais/i,'Guia do IR e da CSLL da empresa (trimestral)'],[/^Carnê-leão/i,'Carnê-leão: IR sobre aluguel ou serviços recebidos de pessoa física']];
  for(const [re,nome] of R)if(re.test(t))return nome+comp;return t}
function oQueFazer(p){const t=p.titulo;if(p.tipo==='feriado')return p.cidade?'Feriado em '+p.cidade+': organize a escala e combine a folga ou o pagamento em dobro.':'Feriado: organize a escala e combine a folga ou o pagamento em dobro.';
  if(/sal[aá]rio/i.test(t)&&/5º dia útil|quinto dia/i.test(t))return 'Pague os salários dos funcionários até esta data.';
  if(/13º|13o|décimo/i.test(t)&&/parcela/i.test(t))return 'Pague a parcela do 13º salário aos funcionários.';
  if(/FGTS/i.test(t))return 'Pague a guia do FGTS que a Moreira enviar.';
  if(/DARF da DCTFWeb|INSS/i.test(t))return 'Pague a guia do INSS e do IR dos funcionários que a Moreira enviar.';
  if(/^DAS/i.test(t))return 'Pague a guia do '+(/MEI/i.test(t)?'MEI':'Simples Nacional')+' que a Moreira enviar.';
  if(/jornada|escala|6x1|5x2/i.test(t))return 'Comece a nova escala nesta data: no máximo 42 horas e 2 folgas por semana, sem reduzir salário.';
  if(/invent[aá]rio/i.test(t))return 'Faça a contagem do estoque e envie a lista para a Moreira.';
  if(p.tipo==='imposto')return 'Pague a guia que a Moreira enviar até esta data.';
  if(p.tipo==='declaracao'||/eSocial|DCTFWeb|EFD|declara/i.test(t))return 'A Moreira entrega. Envie a tempo as notas, a folha e os documentos do mês.';
  return 'Fique atento a esta data.'}
const q=new URLSearchParams(location.search);
const hojeD=new Date();const padrao=(()=>{const d=new Date(hojeD);if(d.getDate()>=25)d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,7)})();
const selM=document.getElementById('mes'),selC=document.getElementById('cid');
for(let k=-2;k<=6;k++){const d=new Date(hojeD.getFullYear(),hojeD.getMonth()+k,1);const v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');let n=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});selM.add(new Option(n.charAt(0).toUpperCase()+n.slice(1),v))}
selM.value=q.get('mes')||padrao;selC.value=q.get('cidade')||'';
let DATA=null,BASE=[],VIS={};
async function carregar(){const nc={cache:'no-store'};const t='?v='+Date.now();
  const [d,b,c]=await Promise.all([fetch('data.json'+t,nc).then(r=>r.json()),fetch('prazos_base.json'+t,nc).then(r=>r.ok?r.json():[]).catch(()=>[]),fetch('vis-config.json'+t,nc).then(r=>r.ok?r.json():{}).catch(()=>({}))]);
  DATA=d;BASE=Array.isArray(b)?b:(b.prazos||[]);
  if(c.script){try{VIS=(await fetch(c.script+'?t='+Date.now(),nc).then(r=>r.json())).itens||{}}catch(e){}}
  montar()}
const visivel=i=>{const x=VIS[i.id];return x&&typeof x.cliente==='boolean'?x.cliente:i.cliente!==false};
function prazos(){const key=p=>p.data+'|'+String(p.titulo).toLowerCase().slice(0,22);const ps=DATA.prazos||[];const ids=new Set(ps.map(p=>p.id)),ks=new Set(ps.map(key));
  return [...ps,...BASE.filter(b=>!ids.has(b.id)&&!ks.has(key(b)))].filter(p=>p.data).sort((a,b)=>a.data.localeCompare(b.data))}
function linhas(lst){if(!lst.length)return '<p class="vazio">Nenhuma data neste mês.</p>';
  return '<table>'+lst.map(p=>{const dt=new Date(p.data+'T12:00:00');const fer=p.tipo==='feriado';
    return `<tr class="${fer?'fer':''}"><td class="d">${esc(p.data.slice(8))}/${esc(p.data.slice(5,7))}<small>${DS[dt.getDay()]}</small></td><td><b>${esc(fer?p.titulo:amigo(p))}${fer?' <span class="tag">'+(p.cidade?'Feriado · '+esc(p.cidade):'Feriado')+'</span>':''}${prazoArea(p)==='dp'&&!fer?' <span class="tag m">Atraso gera multa</span>':''}</b><span>${esc(oQueFazer(p))}</span></td></tr>`}).join('')+'</table>'}
function novs(lst){if(!lst.length)return '<p class="vazio">Sem novidades nesta área no período.</p>';
  return lst.map(i=>`<div class="nov${i.setor==='dp'?' dp':''}"><h3>${esc(P(i.card_titulo||i.titulo))}${i.card_destaque?' '+esc(P(i.card_destaque)):''}${i.setor==='dp'&&temMulta(i)?' <span class="tag m">Pode gerar multa</span>':''}</h3><p>${esc(P(i.card_sub||i.resumo))}</p>${i.card_acao?`<p class="ac">O que fazer: ${esc(P(i.card_acao))}</p>`:''}</div>`).join('')}
function montar(){const mk=selM.value,cid=selC.value;const [y,m]=mk.split('-').map(Number);
  let nome=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});nome=nome.charAt(0).toUpperCase()+nome.slice(1);
  const ps=prazos().filter(p=>p.data.startsWith(mk)&&(!p.cidade||!cid||p.cidade===cid));
  const seen=new Set();const ups=ps.filter(p=>{const k=p.data+'|'+(p.tipo==='feriado'?p.titulo+p.cidade:amigo(p));if(seen.has(k))return false;seen.add(k);return true});
  const fis=ups.filter(p=>prazoArea(p)==='fiscal'),dp=ups.filter(p=>prazoArea(p)==='dp');
  const ini=new Date(y,m-2,25).toISOString().slice(0,10),fim=new Date(y,m,0).toISOString().slice(0,10);
  const nv=(DATA.atualizacoes||[]).filter(i=>visivel(i)&&i.data>=ini&&i.data<=fim).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  const sal=dp.find(p=>/sal[aá]rio/i.test(p.titulo)&&/5º dia/i.test(p.titulo));
  const escala=mk<='2026-12'&&mk>='2026-11';
  document.title='Resumo '+nome+' · Moreira Contabilidade';
  document.getElementById('folha').innerHTML=`<div class="cab"><img src="brand/moreira_horizontal_branco_1000w.png" alt="Moreira Contabilidade"><div class="k">Resumo do mês${cid?' · '+esc(cid):''}</div><h1>${esc(nome)}</h1><p>Prazos, feriados e novidades fiscais e de Departamento Pessoal explicados de forma simples.</p></div>
  <div class="cont">
  ${sal||escala?`<div class="alerta">${sal?`<b>Salários: pagar até ${esc(sal.data.slice(8))}/${esc(sal.data.slice(5,7))} (5º dia útil).</b>`:''}${escala?`<b>Nova escala a partir de 16/12/2026: 42 horas e 2 folgas por semana.</b>Organize a escala de cada funcionário e envie para a Moreira conferir. Escala errada gera multa.`:''}</div>`:''}
  <h2>Departamento Pessoal <small>${dp.length} datas</small></h2>${linhas(dp)}
  <h2>Fiscal <small>${fis.length} datas</small></h2>${linhas(fis)}
  <h2>Novidades <small>${nv.length} ${nv.length===1?'novidade':'novidades'}</small></h2>${novs(nv)}
  </div><div class="rod"><span><b>Moreira Contabilidade</b> · CNPJ 33.980.531/0001-47</span><span>WhatsApp (94) 99119-8085 · @moreiracontabilidadeltda</span><span>Datas conforme normas oficiais; podem mudar se o governo prorrogar.</span></div>`}
selM.onchange=selC.onchange=()=>{history.replaceState(null,'','?mes='+selM.value+(selC.value?'&cidade='+encodeURIComponent(selC.value):''));montar()};
document.getElementById('pdf').onclick=()=>window.print();
carregar().catch(()=>{document.getElementById('folha').innerHTML='<div class="cont"><p>Não foi possível carregar agora. Tente de novo.</p></div>'});
</script></body></html>
